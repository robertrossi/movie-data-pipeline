name: Publicar documentação

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construir documentação
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar Python 3.13.5
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Instalar dependências travadas
        run: uv sync --locked --all-groups

      - name: Construir site MkDocs
        run: uv run --locked mkdocs build --strict

      - name: Incluir relatório HTML na raiz publicada
        run: cp relatorio.html site/relatorio.html

      - name: Carregar artefato do GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4
